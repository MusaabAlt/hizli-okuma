<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Hızlı Okuma Teknikleri</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    #app {
      width: min(100%, 1000px);
    }
    #player-frame {
      width: 100%;
      aspect-ratio: 800 / 576;
      background: #000;
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
    }
    #player,
    ruffle-player {
      display: block;
      width: 100%;
      height: 100%;
    }
    #status {
      margin-top: 10px;
      color: #bbb;
      font-size: 13px;
      text-align: center;
    }
  </style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <main id="app">
    <div id="player-frame">
      <div id="player"></div>
    </div>
    <div id="status">Loading Hızlı Okuma Teknikleri…</div>
  </main>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const status = document.getElementById("status");

      try {
        if (!window.RufflePlayer) {
          throw new Error("Ruffle failed to load.");
        }

        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        player.style.width = "100%";
        player.style.height = "100%";

        document.getElementById("player").appendChild(player);
        await player.ruffle().load("hizlioku_main.swf");
        status.textContent = "Hızlı Okuma Teknikleri";
      } catch (error) {
        console.error(error);
        status.textContent = "The Flash application could not be loaded. Open the browser console for details.";
      }
    });
  </script>
</body>
</html>
